    <script type="text/javascript">
      $(document).ready(function(){
    	  	// Na klik checkboxa:
            $('.loz').click(function(){
            	// Proveri da li je checkbox označen
                // Ako je označen, promeni tip inputa sa klasom 'lozinput' u 'text'
                // Ako nije označen, promeni tip inputa sa klasom 'lozinput' u 'password'
                $(this).is(':checked') ? $('.lozinput').attr('type', 'text') : $('.lozinput').attr('type', 'password');
            });
      
      		// Kod za sprecavanje korisnika da unese datum u buducnosti
      		
            var dtToday = new Date();
			// Uzmi treuntni mesec, dan i godinu
            var month = dtToday.getMonth() + 1;
            var day = dtToday.getDate();
            var year = dtToday.getFullYear();
			
            // Dodaj vodecu nulu ako je mesec ili dan manji od 0
            if(month < 10)
                month = '0' + month.toString();
            if(day < 10)
                day = '0' + day.toString();
			// Formatiraj danasnji tj. maksimalni datum u string koji input moze da primi kao atribut
            var maxDate = year + '-' + month + '-' + day;  
         	// Setuj maksimalni datum na danasnji datumm
            $('#birth_date').attr('max', maxDate);
            
        });
    </script>

    <form

      action="/PrviMavenVebProjekat/korisnici/add"
      method="post">
      
      <div class="form-group">
    <label for="username" th:text="#{registracija.korisnickoime}">Korisničko ime:</label>
    <input type="text" id="username" name="korime" th:placeholder="#{registracija.korisnickoime.placeholder}" />
</div>

<div class="form-group">
    <label for="password" th:text="#{registracija.lozinka}">Lozinka:</label>
    <input class="lozinput" type="password" id="password" name="lozinka" th:placeholder="#{registracija.lozinka.placeholder}" />
</div>

<div class="form-group">
    <label for="password_repeat" th:text="#{registracija.ponovilozinku}">Ponovite lozinku:</label>
    <input class="lozinput" type="password" id="password_repeat" name="lozinkaopet" th:placeholder="#{registracija.ponovilozinku.placeholder}" />
    <p class="lozp">
        <input type="checkbox" class="loz" />
        <span th:text="#{registracija.prikazilozinku}">Prikaži Lozinke</span>
    </p>
</div>

<div class="form-group">
    <label for="email" th:text="#{registracija.email}">Email adresa:</label>
    <input type="email" id="email" name="email" th:placeholder="#{registracija.email.placeholder}" />
</div>

<div class="form-group">
    <label for="first_name" th:text="#{registracija.ime}">Ime:</label>
    <input type="text" id="first_name" name="ime" th:placeholder="#{registracija.ime.placeholder}" />
</div>

<div class="form-group">
    <label for="last_name" th:text="#{registracija.prezime}">Prezime:</label>
    <input type="text" id="last_name" name="prezime" th:placeholder="#{registracija.prezime.placeholder}" />
</div>

<div class="form-group">
    <label for="birth_date" th:text="#{registracija.datumrodjenja}">Datum rođenja:</label>
    <input type="date" id="birth_date" name="datumrodjenja" min="1900-01-01" />
</div>

<button type="submit" th:text="#{registracija.dugme}">Registruj se</button>
