<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
    <title>Registracija korisnika</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 8px;
            padding: 30px 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"], input[type="password"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <form action="/PrviMavenVebProjekat/korisnici/add" method="post">
        <h1>REGISTRACIJA</h1>
        
        <div class="form-group">
            <label for="username">Korisničko ime:</label>
            <input type="text" id="username" name="korime">
        </div>

        <div class="form-group">
            <label for="password">Lozinka:</label>
            <input type="password" id="password" name="lozinka">
        </div>

        <div class="form-group">
            <label for="password_repeat">Ponovite lozinku:</label>
            <input type="password" id="password_repeat" name="lozinkaopet">
        </div>

        <div class="form-group">
            <label for="email">Email adresa:</label>
            <input type="text" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="first_name">Ime:</label>
            <input type="text" id="first_name" name="ime">
        </div>

        <div class="form-group">
            <label for="last_name">Prezime:</label>
            <input type="text" id="last_name" name="prezime">
        </div>

        <div class="form-group">
            <label for="birth_date">Datum rođenja:</label>
            <input type="date" id="birth_date" name="datumrodjenja">
        </div>

        <button type="submit">Registruj se</button>
    </form>
</body>
</html>
