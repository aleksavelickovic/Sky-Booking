     <script type="text/javascript">
      $(document).ready(function(){
    	  	/* // Na klik checkboxa:
            $('.loz').click(function(){
            	// Proveri da li je checkbox označen
                // Ako je označen, promeni tip inputa sa klasom 'lozinput' u 'text'
                // Ako nije označen, promeni tip inputa sa klasom 'lozinput' u 'password'
                $(this).is(':checked') ? $('.lozinput').attr('type', 'text') : $('.lozinput').attr('type', 'password');
            }); */
      
      		// Kod za sprecavanje korisnika da unese datum u buducnosti
      		
         
		  $(document).ready(function () {
			  var dtToday = new Date();
			  // Get the current year, month, day, hours, and minutes
			  var year = dtToday.getFullYear();
			  var month = dtToday.getMonth() + 1;
			  var day = dtToday.getDate();
			  var hours = dtToday.getHours();
			  var minutes = dtToday.getMinutes();

			  // Add leading zeros if necessary
			  if (month < 10) month = '0' + month.toString();
			  if (day < 10) day = '0' + day.toString();
			  if (hours < 10) hours = '0' + hours.toString();
			  if (minutes < 10) minutes = '0' + minutes.toString();

			  // Format the minimum date and time
			  var minDateTime = year + '-' + month + '-' + day + 'T' + hours + ':' + minutes;

    // Set the min attribute for the datetime-local input
    $('#birth_date').attr('min', minDateTime);
});

            
        });
    </script>
    
<style>

form {

}

label {
	display: block;
	margin-bottom: 8px;
	font-weight: bold;
}

input[type="text"], select {
	width: 100%;
	padding: 8px;
	margin-bottom: 16px;

	border-radius: 4px;
	box-sizing: border-box;
}

input[type="submit"] {
	background-color: #003366;

input[type="submit"]:hover {

}
@keyframes flip-left {
        0% {
            transform: perspective(400px) rotateY(180deg);
        }
        100% {
            transform: perspective(400px) rotateY(0deg);
        }
    }

    .flip-left {
        animation: flip-left 1s;
        backface-visibility: hidden;
    }
</style>
