<style>
.floating-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
       	z-index: 1000;
       	width: 300px;
    }
    button {
        width: 100%;
        background-color: #003366;
        color: #ffffff;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #fafbfc;
        color: black;
        border: 0.1px solid black;
      }
body {
	font-family: Arial, sans-serif;
	background-color: #f4f4f9;
	margin: 0;
	padding: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
}

form {
	background-color: #ffffff;
	border: 1px solid #dddddd;
	border-radius: 8px;
	padding: 20px 30px;
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	width: 300px;
}

label {
	display: block;
	margin-bottom: 8px;
	font-weight: bold;
}

input[type="text"], select {
	width: 100%;
	padding: 8px;
	margin-bottom: 16px;
	border: 1px solid #cccccc;
	border-radius: 4px;
	box-sizing: border-box;
}

input[type="submit"] {
	background-color: #003366;
	color: #ffffff;
	padding: 10px 15px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	width: 100%;
	font-size: 16px;
	transition: background-color 0.3s ease;
}

input[type="submit"]:hover {
	background-color: #fafbfc;
	color: black;
	border: 0.1px solid black;
}
@keyframes flip-left {
        0% {
            transform: perspective(400px) rotateY(180deg);
        }
        100% {
            transform: perspective(400px) rotateY(0deg);
        }
    }

    .flip-left {
        animation: flip-left 1s;
        backface-visibility: hidden;
    }
</style>
</head>
<body style="background-color: #05dff3;">
<!-- <nav class="navbar navbar-expand-md bg-dark py-3" data-bs-theme="dark" th:include="header-footer :: navbar">></nav> --> 
	<form class="flip-left" action="/PrviMavenVebProjekat/lokacije/add" method="post">
		<label for="grad">Grad:</label> <input type="text" name="grad"
			id="grad" /> <label for="drzava">Država:</label> <input type="text"
			name="drzava" id="drzava" /> <label for="kontinent">Kontinent:</label>
		<select name="kontinent" id="kontinent">
			<option value="Evropa">Evropa</option>
			<option value="Amerika">Amerika</option>
			<option value="Azija">Azija</option>
			<option value="Australija">Australija</option>
			<option value="Afrika">Afrika</option>
			<option value="Antartika">Antartika</option>
			<option value="Okeanija">Okeanija</option>
		</select> 
		<input type="submit" value="Potvrdi">
	</form>
	<a th:href="@{/}">
     	<button class="button floating-button" type="button">Nazad</button>
     </a>
