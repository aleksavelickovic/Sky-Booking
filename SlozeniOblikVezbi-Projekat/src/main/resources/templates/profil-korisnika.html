<html data-bs-theme="light" lang="en"  xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    
    <title>Korisnicki profil</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" th:href="@{/assets/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Titillium+Web:400,600,700}">
    <link rel="stylesheet" th:href="@{/assets/css/aos.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards-_app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Change-Text-on-Hover.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize-materialize.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Ripple-Effect-Animation-Wave-Pulse.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Footer-Multi-Column-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Google-Style-Login-.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Growing-Search-Bar-Animated-Text-Input.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Overlay-Login-Form.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Search-Input-responsive.css}">
    <script
      th:src="@{/webjars/jquery/3.2.1/jquery.js}"
      type="text/javascript"
    ></script>

</head>

<body style="background-color: #05dff3;">

    <div class="row mt-4 space-rows">
        <div class="col offset-xl-0">
            <div class="card">
                <div class="card-header" style="height: 300px;">
                    <div class="cardheader-text">
                        <p id="cardheader-subtext-1" class="mt-4" style="font-size: 15px;"></p>
                        <div class="mb-3"></div>
                        
                        
                        <!-- <h4 id="heading-card-1" th:text="${korisnik.blokiran} ? 'Korisnik broj: ' + (status.index + 1) + '(BLOKIRAN!)' : 'Korisnik broj: ' + (status.index + 1)"></h4> -->                      		
                        <p id="cardheader-subtext-1" class="mt-3" th:text="${'Korisnicko Ime: ' + korisnik.korisnickoIme}"></p>
                        <p id="cardheader-subtext-1" th:text="${'Lozinka: ' + korisnik.lozinka}"></p>
                        <p id="cardheader-subtext-1" th:text="${'Email: ' + korisnik.email}"></p>
                        <p id="cardheader-subtext-1" th:text="${'Ime I Prezime: ' + korisnik.ime + ' ' + korisnik.prezime}"></p>
                        <p id="cardheader-subtext-1" th:text="${'Datum Rodjenja: ' + korisnik.datumRodjenja}"></p>
                        <!-- strings.substring zato sto su poslednja 2 karaktera tacka i milisekunde -->
                        <p id="cardheader-subtext-1" th:text="${#strings.substring('Datum I Vreme registracije: ' + korisnik.datumIVremeRegistracije, 0, 47)}"></p>
                        <p id="cardheader-subtext-1" th:text="${'Uloga: ' + korisnik.uloga}"></p>
      
						<!-- <p id="cardheader-subtext-1" th:if="${korisnik.blokiran}" th:text="${'Korisnik je BLOKIRAN!'}"></p> -->
                    </div>
                    </div>
                </div>
                <div class="card-body" style="background-color: white; margin-top: -16px;">
                    <p class="card-text sub-text-color">Akcije:
                    <div><a href="edit"><button class="button" type="button" data-hover="Stranica za izmenu Vasih podataka"><span>Izmenite Vas profil</span></button></a></div>
                    <div><a href="/PrviMavenVebProjekat/"><button class="button" type="button" data-hover="Pocetna stranica"><span>Pocetna stranica</span></button></a></div>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div class="position-absolute d-flex justify-content-start gap-5 container" style="margin-left: 27.5%;">
        <h1>Vase rezervacije:</h1>
        <h1>Lista zelja:</h1>
    </div>
    <div class="position-absolute d-flex justify-content-start gap-5 container" style="margin-left: 27.5%;margin-top: 140px;">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered sortable">
                <thead>
                    <tr>
                        <th>Datum rezervacije</th>
                        <th>Letovi u rezervaciji</th>
                        <th>Ukupna cena</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rezervacija : ${rezervacije}">
                        <td th:text="${rezervacija.datumIVremeKreiranja}"></td>
                        <td th:text="${rezervacija}">Letovi</td>
                        <td th:text="${rezervacija.ukupnaCena}">ukupnaCena</td>
                    </tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
        <div>
            <table class="table table-striped table-hover table-bordered float-start">
                <thead>
                    <tr>
                        <th>Oznaka leta</th>
                        <th>Broj preostalih mesta</th>
                        <th>Ukloni iz liste zelja</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Cell 1</td>
                        <td>Cell 2</td>
                        <td><button class="btn btn-primary" type="button">ukloni</button></td>
                    </tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
    </div>
    
  
    <script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
    <script th:src="@{/assets/js/aos.min.js}"></script>
    <script th:src="@{/assets/js/bs-init.js}"></script>
    <script th:src="@{/assets/js/button-materialize-materialize.min.js}"></script>
    <script th:src="@{/assets/js/Button-Ripple-Effect-Animation-Wave-Pulse-button-ripple-effect.js}"></script>
    <script th:src="@{/assets/js/sorttable.js}"></script>
    
</body>

</html>
