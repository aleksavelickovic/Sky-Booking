<html data-bs-theme="light" lang="en"  xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    
    <title th:text="#{profil.title}">Korisnicki profil</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" th:href="@{/assets/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Titillium+Web:400,600,700}">
    <link rel="stylesheet" th:href="@{/assets/css/aos.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards-_app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Change-Text-on-Hover.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize-materialize.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Ripple-Effect-Animation-Wave-Pulse.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Footer-Multi-Column-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Google-Style-Login-.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Growing-Search-Bar-Animated-Text-Input.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Overlay-Login-Form.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Search-Input-responsive.css}">
    <script
      th:src="@{/webjars/jquery/3.2.1/jquery.js}"
      type="text/javascript"
    ></script>

</head>

<body style="background-color: #05dff3;">

    <div class="row mt-4 space-rows">
        <div class="col offset-xl-0">
            <div class="card">
                <div class="card-header" style="height: 300px;">
                    <div class="cardheader-text">
                        <p id="cardheader-subtext-1" class="mt-4" style="font-size: 15px;"></p>
                        <div class="mb-3"></div>
                        
                        
                        <!-- <h4 id="heading-card-1" th:text="${korisnik.blokiran} ? 'Korisnik broj: ' + (status.index + 1) + '(BLOKIRAN!)' : 'Korisnik broj: ' + (status.index + 1)"></h4> -->                      		
                        <p id="cardheader-subtext-1" class="mt-3" th:text="#{profil.korisnickoime} + ' ' + ${korisnik.korisnickoIme}"></p>
                        <p id="cardheader-subtext-1" th:text="#{profil.lozinka} + ' ' + ${korisnik.lozinka}"></p>
                        <p id="cardheader-subtext-1" th:text="#{profil.email} + ' ' + ${korisnik.email}"></p>
                        <p id="cardheader-subtext-1" th:text="#{profil.imeiprezime} + ' ' + ${korisnik.ime} + ' ' + ${korisnik.prezime}"></p>
                        <p id="cardheader-subtext-1" th:text="#{profil.datumrodjenja} + ' ' + ${korisnik.datumRodjenja}"></p>
                        <!-- strings.substring zato sto su poslednja 2 karaktera tacka i milisekunde -->
                        <p id="cardheader-subtext-1" th:text="#{profil.datumivremeregistracije} + ' ' + ${korisnik.datumIVremeRegistracije}"></p>
                        <p id="cardheader-subtext-1" th:text="#{profil.uloga} + ' ' + ${korisnik.uloga}"></p>
      
						<!-- <p id="cardheader-subtext-1" th:if="${korisnik.blokiran}" th:text="${'Korisnik je BLOKIRAN!'}"></p> -->
                    </div>
                    </div>
                </div>
                <div class="card-body" style="background-color: white; margin-top: -16px;">
                    <p class="card-text sub-text-color" th:text="#{profil.akcije}">Akcije:
                    <div><a href="edit"><button class="button" type="button" th:data-hover="#{profil.stranicazaizmenupodataka}"><span th:text="#{profil.izmeni}">Izmenite Vas profil</span></button></a></div>
                    <div><a href="/PrviMavenVebProjekat/"><button class="button" type="button" th:data-hover="#{profil.pocetna}"><span th:text="#{profil.pocetna}">Pocetna stranica</span></button></a></div>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div class="position-absolute d-flex justify-content-start gap-5 container" style="margin-left: 27.5%;">
        <h1 th:text="#{profil.vaserezervacije}">Vase rezervacije:</h1>
        <h1 th:text="#{profil.listazelja}">Lista zelja:</h1>
    </div>
    <div class="position-absolute d-flex justify-content-start gap-5 container" style="margin-left: 27.5%;margin-top: 140px;">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered sortable">
                <thead>
                    <tr>
                        <th th:text="#{profil.datumrezervacije}">Datum rezervacije</th>
                        <th th:text="#{profil.letoviurezervaciji}">Letovi u rezervaciji</th>
                        <th th:text="#{profil.ukupnacena}">Ukupna cena</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rezervacija : ${rezervacije}">
                        <td th:text="${rezervacija.datumIVremeKreiranja}">datum i vreme kreiranja</td>
                        <td th:text="${rezervacija}">Letovi</td>
                        <td th:text="${rezervacija.ukupnaCena}">ukupnaCena</td>
                    </tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
        <div>
            <table class="table table-striped table-hover table-bordered float-start sortable">
                <thead>
                    <tr>
                        <th th:text="#{profil.oznakaleta}">Oznaka leta</th>
                        <th th:text="#{profil.brojpreostalihmesta}">Broj preostalih mesta</th>
                        <th th:text="#{profil.rezervisiovajlet}">Rezervisi ovaj let</th>
                        <th th:text="#{profil.uklonisalistezelja}">Ukloni iz liste zelja</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="let : ${letovinalistizelja}">
                    	<td th:text="${let.oznaka}">Oznaka leta</td>
                        <td th:if="${let.brojMesta > 0}"  th:text="${let.brojMesta}">Broj mesta</td>
                        <td th:if="${let.brojMesta <= 0}">Rasprodat!</td>
                       
                        <td><form action="/PrviMavenVebProjekat/seatoptions" method="GET">
						
						<button class="btn btn-primary" id="rezervisibtn" type="submit"  th:text="#{profil.rezervisi}" >rezervisi</button>
						<input class="hidden" type="hidden" name="letId" th:value="${let.id}">
						</form></td>
                        <td><a th:href="${'/PrviMavenVebProjekat/letovi/ukloniizlistezelja?letId=' + let.id}"><button class="btn btn-primary"  th:text="#{profil.ukloni}" type="button">ukloni</button></a></td>
                    </tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
    </div>
    
  
    <script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
    <script th:src="@{/assets/js/aos.min.js}"></script>
    <script th:src="@{/assets/js/bs-init.js}"></script>
    <script th:src="@{/assets/js/button-materialize-materialize.min.js}"></script>
    <script th:src="@{/assets/js/Button-Ripple-Effect-Animation-Wave-Pulse-button-ripple-effect.js}"></script>
    <script th:src="@{/assets/js/sorttable.js}"></script>
    
</body>

</html>
