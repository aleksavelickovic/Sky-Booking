
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Izmeni lokaciju</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    form {
        background-color: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        padding: 20px 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    input[type="text"], select {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    input[type="submit"] {
        background-color: #007bff;
        color: #ffffff;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
<form th:action="@{/lokacije/edit}" method="POST">
    <label for="grad">Grad:</label>
    <input type="text" name="grad" id="grad" th:value="${lokacija.grad}" />

    <label for="drzava">Država:</label>
    <input type="text" name="drzava" id="drzava" th:value="${lokacija.drzava}" />

    <label for="kontinent">Kontinent:</label>
        <select name="kontinent" id="kontinent" th:value="${lokacija.kontinent}">
        <option value="Evropa" th:selected="${lokacija.kontinent.toString() == 'Evropa'}">Evropa</option>
        <option value="Amerika" th:selected="${lokacija.kontinent.toString() == 'Amerika'}">Amerika</option>
        <option value="Azija" th:selected="${lokacija.kontinent.toString() == 'Azija'}">Azija</option>
        <option value="Australija" th:selected="${lokacija.kontinent.toString() == 'Australija'}">Australija</option>
        <option value="Afrika" th:selected="${lokacija.kontinent.toString() == 'Afrika'}">Afrika</option>
        <option value="Antartika" th:selected="${lokacija.kontinent.toString() == 'Antartika'}">Antartika</option>
        <option value="Okeanija" th:selected="${lokacija.kontinent.toString() == 'Okeanija'}">Okeanija</option>
    </select>
	<input type="hidden" name="id" th:value="${lokacija.id}">
    <input type="submit" value="Potvrdi">
</form>

</body>
</html>
