
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
 <meta http-equiv="Pragma" content="no-cache" />
 <meta http-equiv="Expires" content="0" />

<title>Izmeni Let</title>
<link rel="stylesheet" th:href="@{/assets/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Titillium+Web:400,600,700}">
    <link rel="stylesheet" th:href="@{/assets/css/aos.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards-_app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Change-Text-on-Hover.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize-materialize.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Ripple-Effect-Animation-Wave-Pulse.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Overlay-Login-Form.css}">
    <base th:href="@{/}">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #05dff3;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    form {
        background-color: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        padding: 20px 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    input[type="text"], select {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    input[type="submit"] {
        background-color: #007bff;
        color: #ffffff;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
        background-color: #0056b3;
    }
    @keyframes flip-left {
        0% {
            transform: perspective(400px) rotateY(180deg);
        }
        100% {
            transform: perspective(400px) rotateY(0deg);
        }
    }

    .flip-left {
        animation: flip-left 1s;
        backface-visibility: hidden;
    }
</style>
</head>
<body>
<form th:action="@{/letovi/edit}" method="POST" class="flip-left">
    <label for="oznaka">Oznaka:</label>
    <input type="text" name="oznaka" id="oznaka" th:value="${let.oznaka}" />

    <label for="polazak">Polazak:</label>
    <input type="datetime-local" name="polazak" id="polazak" th:value="${let.terminPolaska}" />

    <label for="trajanje">Trajanje:</label>
    <input type="number" name="trajanje" id="trajanje" th:value="${let.trajanjeLeta}" />

    <label for="cena">Cena:</label>
    <input type="number" name="cena" id="cena" th:value="${let.cena}" />

    <label for="polaziste">Polazište:</label>
    <select name="polaziste" id="polaziste" th:value="${let.polaziste.id}">
        <option th:each="aerodrom : ${aerodromi}" th:value="${aerodrom.id}" th:text="${aerodrom.oznaka} + ', ' + ${aerodrom.lokacija.grad} + ', ' + ${aerodrom.lokacija.drzava}"
         th:selected="${let.polaziste.id == aerodrom.id}"></option>
    </select>

    <label for="odrediste">Odredište:</label>
    <select name="odrediste" id="odrediste" th:value="${let.odrediste.id}">
        <option th:each="aerodrom : ${aerodromi}" th:value="${aerodrom.id}" th:text="${aerodrom.oznaka} + ', ' + ${aerodrom.lokacija.grad} + ', ' + ${aerodrom.lokacija.drzava}"
         th:selected="${let.odrediste.id == aerodrom.id}"></option>
    </select>

    <label for="avion">Avion:</label>
    <select name="avion" id="avion" th:value="${let.avion.id}">
        <option th:each="avion : ${avioni}" th:value="${avion.id}" th:text="${avion.naziv}" th:selected="${let.avion == avion.id}"></option>
    </select>
	
	<input type="hidden" name="naAkciji" th:value="${let.naAkciji}">
    <input type="hidden" name="id" th:value="${let.id}">
    <input type="hidden" name="brojMesta" th:value="${let.brojMesta}">"
    <p th:text="${poruka}" style="background-color:#ed0c0c;" id="greska">Ispis greske</p>
    <input type="hidden" th:value="${let.razlogOtkaza}" name="razlogOtkaza"/>
    <input type="submit" value="Potvrdi">
    <div th:if="${uspeh != null and uspeh == true}">
			<p th:text="${uspehporuka}" style="background-color:#4A9A4E;" id="uspeh">Ispis uspeha</p>
			<a href="/PrviMavenVebProjekat/">
		<button class="button" type="button">Pocetna stranica</button>
	</a>
		</div>
</form>
	<script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
    <script th:src="@{/assets/js/aos.min.js}"></script>
    <script th:src="@{/assets/js/bs-init.js}"></script>
    <script th:src="@{/assets/js/button-materialize-materialize.min.js}"></script>
    <script th:src="@{/assets/js/Button-Ripple-Effect-Animation-Wave-Pulse-button-ripple-effect.js}"></script>
</body>

</html>
