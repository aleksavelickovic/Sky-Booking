<html data-bs-theme="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title th:text="#{statistika.title}">Statistika</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" th:href="@{/assets/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Titillium+Web:400,600,700}">
    <link rel="stylesheet" th:href="@{/assets/css/aos.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards-_app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Animation-Cards.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Change-Text-on-Hover.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize-materialize.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/button-materialize.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Button-Ripple-Effect-Animation-Wave-Pulse.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Footer-Multi-Column-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Google-Style-Login-.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Growing-Search-Bar-Animated-Text-Input.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Overlay-Login-Form.css}">
    <link rel="stylesheet" th:href="@{/assets/css/Search-Input-responsive.css}">
    
    <script th:src="@{/webjars/jquery/3.2.1/jquery.js}" type="text/javascript"></script>
</head>

<body style="background-color: #05dff3;">

<nav class="navbar navbar-expand-md bg-dark py-3" data-bs-theme="dark" th:include="header-footer :: navbar"></nav>

<div class="container mt-5">
    <div class="text-center mb-4">
        <form action="/PrviMavenVebProjekat/letovi/statistics" method="GET">
            <label for="pocetniDatum" th:text="#{statistika.od}">Sve karte od:</label>
            <input type="date" id="pocetniDatum" name="pocetniDatum">
            <label for="krajnjiDatum" th:text="#{statistika.do}">do:</label>
            <input type="date" id="krajnjiDatum" name="krajnjiDatum">
            <button class="btn btn-primary" type="submit" th:text="#{statistika.prikazi}">Prikazi izvestaj</button>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered sortable">
            <thead>
                <tr>
                    <th th:text="#{statistika.kartaid}">ID Karte</th>
                    <th th:text="#{statistika.letoznaka}">Oznaka leta</th>
                    <th th:text="#{statistika.ukupnamesta}">Ukupan broj mesta na letu</th>
                    <th th:text="#{statistika.prodatamesta}">Broj prodatih mesta na letu</th>
                    <th th:text="#{statistika.zaradaodleta}">Ukupna zarada od ovog leta</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="karta : ${karte}">
                    <td th:text="${karta.id}">ID Karte</td>
                    <td th:text="${karta.let.oznaka}">Oznaka leta</td>
                    <td th:text="${karta.let.avion.brojRedova * karta.let.avion.brojKolona}">Ukupan broj mesta</td>
                    <td th:text="${(karta.let.avion.brojRedova * karta.let.avion.brojKolona) - karta.let.brojMesta}">Prodata mesta</td>
                    <td th:text="${((karta.let.avion.brojRedova * karta.let.avion.brojKolona) - karta.let.brojMesta) * karta.cena}">Zarada</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <td th:text="#{statistika.ukupnoKarata}">Ukupan broj svih rezervisanih karata:</td>
                    <td th:text="${ukupanBrojKarata}">ukupanBrojKarata</td>
                    <td th:text="#{statistika.ukupnaZarada}">Ukupna zarada od svih karata:</td>
                    <td th:text="${ukupnaCenaKarata}">ukupnaZarada</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<footer class="text-center bg-dark" th:include="header-footer :: footer"></footer>

<script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/aos.min.js}"></script>
<script th:src="@{/assets/js/bs-init.js}"></script>
<script th:src="@{/assets/js/button-materialize-materialize.min.js}"></script>
<script th:src="@{/assets/js/Button-Ripple-Effect-Animation-Wave-Pulse-button-ripple-effect.js}"></script>
<script th:src="@{/assets/js/sorttable.js}"></script>

</body>
</html>
